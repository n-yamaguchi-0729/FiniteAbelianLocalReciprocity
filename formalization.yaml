# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: v0.4

project:
  name: "Local class field theory in Lean 4.34.0"
  description: >-
    For every finite abelian extension L/K of a nonarchimedean local field,
    the multiplicative group K× modulo the field-norm subgroup N_{L/K}(L×)
    is isomorphic as a topological group to Gal(L/K). The registered
    declaration is the finite norm-quotient form of local reciprocity proved
    in the pinned ClassFieldTheory development. Stronger compatibility,
    normalization and existence results in that development are documented
    separately and are not part of the compared declaration.
  authors: ["Naganori Yamaguchi"]
  responsible_maintainers: ["Naganori Yamaguchi"]
  license: "Apache-2.0"

repository:
  substantive_formalization:
    id: "n-yamaguchi-0729/ClassFieldTheory"
    revision: "01b4614ee76fa6f50e7f3ea3e1cff93b85693345"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11S31"]

sources:
  - title: "Class Field Theory (version 4.03)"
    authors: ["J. S. Milne"]
    id: "https://www.jmilne.org/math/CourseNotes/CFT.pdf"
    type: book
    location: "Chapter I, §1, Theorem 1.1(b), printed p. 20 (PDF p. 29)"
    relationship: formalizes
    note: >-
      Milne states the uniquely normalized local Artin map and the induced
      norm-quotient isomorphism. The compared Lean declaration records the
      latter topological isomorphism as a nonempty type; it does not by itself
      retain the named map, its normalization, or its uniqueness.

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4/tree/5ed2965256430c3649e86755f9576b54eca72435"
    relationship: builds-on
    note: >-
      Mathlib supplies the local-field, field-norm, Galois-group, quotient,
      and topological-group vocabulary used by the Challenge.

status:
  scope: >-
    The selected result is exactly
    ClassFieldTheory.finiteAbelianLocalReciprocity_quotient for finite
    abelian extensions of nonarchimedean local fields. It gives a nonempty
    continuous multiplicative equivalence with continuous inverse. It does
    not itself assert Frobenius normalization, tower or family compatibility,
    uniqueness of a normalized family, the local existence correspondence,
    or the maximal-abelian/profinite theorem. The finite companion results
    are separate proved declarations in the pinned substantive repository
    and are listed in the README.
  sorry_count: 0
  sorry_in_definitions: 0

automation:
  methods:
    - method: agent
      models: ["Astra GPT-6 Codex"]
      framework: "Codex"
      tool_setup: >-
        AI-assisted Lean development and maintenance of the underlying CFT
        library, followed by source-level statement review and thin-wrapper
        preparation. Human authorship and responsibility remain with the
        named maintainer.
fidelity:
  divergences: >-
    The source presents the quotient isomorphism as induced by a uniquely
    normalized Artin map. The compared declaration retains the topological
    norm-quotient isomorphism but forgets the particular map, Frobenius
    normalization, and uniqueness. It also does not include the separate
    local existence theorem. The README identifies the corresponding stronger
    declarations already proved in CFT.

review:
  status: "agent-reviewed"
  reviewers: ["Codex"]
  notes: >-
    The Challenge definitions and theorem type were compared with the pinned
    substantive source, and the statement was checked against the cited
    mathematical reference.

alignment:
  namespace: "ClassFieldTheory"
  statements:
    - source: >-
        J. S. Milne, Class Field Theory, Chapter I, §1, Theorem 1.1(b),
        printed p. 20 (PDF p. 29)
      lean: "ClassFieldTheory.finiteAbelianLocalReciprocity_quotient"
      module: "ClassFieldTheory.Theorems.LocalClassFieldTheory.FiniteAbelianLocalReciprocityQuotient"
      status: "proved in the pinned substantive repository"
      note: >-
        The Challenge copies the exact norm definitions and theorem type but
        replaces only the proof with the deliberate Comparator placeholder.

acknowledgements: >-
  This development builds on Lean and Mathlib. Naganori Yamaguchi is the
  human author and responsible maintainer.
